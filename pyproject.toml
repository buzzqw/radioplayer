[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radioplayer"
version = "3.1.0"
description = "Terminal-based internet radio player with Rich TUI, ICY metadata, recording, and RadioBrowser integration"
license = {text = "GPL-3.0"}
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Andres Zanzani", email = "azanzani@gmail.com"},
]
keywords = ["radio", "mpv", "tui", "internet-radio", "m3u", "radio-browser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]

dependencies = [
    "rich>=13.7.0",
    "requests>=2.31.0",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "urllib3>=1.26",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
    "win10toast>=0.9",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "pyright>=1.1.300",
]

[project.scripts]
radioplayer = "radioplayer.__main__:main"

[project.urls]
Homepage = "https://github.com/buzzqw/radioplayer"
Repository = "https://github.com/buzzqw/radioplayer"
Issues = "https://github.com/buzzqw/radioplayer/issues"

[tool.setuptools]
packages = ["radioplayer"]

[tool.ruff]
target-version = "py38"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
